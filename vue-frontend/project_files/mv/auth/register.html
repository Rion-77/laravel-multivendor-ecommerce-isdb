<!DOCTYPE html>
<html lang="en" class="light-style " dir="ltr" data-theme="theme-default" data-assets-path="../assets/" data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Register | Bazaarly Multivendor Marketplace</title>
    <meta name="description" content="Bazaarly – multivendor e-commerce admin template built on Sneat (Bootstrap 5)." />
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="../assets/vendor/css/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="../assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="../assets/css/demo.css" />
    <link rel="stylesheet" href="../assets/css/multivendor.css" />
    <link rel="stylesheet" href="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="../assets/vendor/css/pages/page-auth.css" />
    <script src="../assets/vendor/js/helpers.js"></script>
    <script src="../assets/js/config.js"></script>
  </head>
  <body><style>.authentication-inner{max-width:560px}</style>
    <div class="container-xxl"><div class="authentication-wrapper authentication-basic container-p-y"><div class="authentication-inner"><div class="card"><div class="card-body">
      <div class="app-brand justify-content-center"><a href="../index.html" class="app-brand-link gap-2"><span class="mv-brand-logo"><i class="bx bxs-store-alt"></i></span><span class="app-brand-text demo text-body fw-bolder">Bazaarly</span></a></div>
<h4 class="mb-2">Join Bazaarly 🚀</h4><p class="mb-4">Shop as a customer or start selling as a vendor</p>
<form data-mv-demo="Account created (demo – submit to your backend).">
  <div class="btn-group w-100 mb-4" role="group"><input type="radio" class="btn-check" name="account_type" id="t1" value="customer" checked /><label class="btn btn-outline-primary" for="t1"><i class="bx bx-user me-1"></i>Customer</label><input type="radio" class="btn-check" name="account_type" id="t2" value="vendor" /><label class="btn btn-outline-primary" for="t2"><i class="bx bx-store-alt me-1"></i>Vendor</label></div>
  <div class="row g-3 mb-3"><div class="col-12"><label class="form-label">Full name</label><input class="form-control" name="name" required /></div>
  <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required /></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required /></div></div>
  <div id="vendorFields" class="d-none"><hr /><h6 class="mb-3">Shop details</h6><div class="row g-3 mb-3"><div class="col-12"><label class="form-label">Shop name</label><input class="form-control" id="shop_name" name="shop_name" data-mv-slug-source="#shop_slug" /></div>
  <div class="col-12"><label class="form-label">Shop URL</label><div class="input-group"><span class="input-group-text">/shop/</span><input class="form-control" id="shop_slug" name="slug" /></div></div>
  <div class="col-12"><label class="form-label">Shop description</label><textarea class="form-control" name="description" rows="3"></textarea><div class="form-text">Vendor accounts are reviewed before they can publish products.</div></div></div></div>
  <div class="mb-3 form-password-toggle"><label class="form-label" for="password">Password</label><div class="input-group input-group-merge"><input type="password" id="password" class="form-control" name="password" placeholder="············" required /><span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span></div></div>
  <div class="mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="terms" required /><label class="form-check-label" for="terms">I agree to the <a href="#">terms &amp; privacy policy</a></label></div></div>
  <button class="btn btn-primary d-grid w-100" type="submit">Sign up</button></form>
<p class="text-center mt-3"><span>Already have an account?</span> <a href="login.html">Sign in</a></p>
    </div></div></div></div></div>
    <script src="../assets/vendor/libs/jquery/jquery.js"></script>
    <script src="../assets/vendor/libs/popper/popper.js"></script>
    <script src="../assets/vendor/js/bootstrap.js"></script>
    <script src="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="../assets/vendor/js/menu.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/multivendor.js"></script>
  </body>
</html>
